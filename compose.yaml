services:
  bambu-monitor:
    image: ghcr.io/dfrnoch/bambu-monitor:latest
    restart: unless-stopped
    depends_on:
      - go2rtc
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /data
      AUTO_CONNECT: "true"
      GO2RTC_URL: http://go2rtc:1984
      GO2RTC_PUBLIC_URL: ${GO2RTC_PUBLIC_URL:-http://localhost:1984}
    ports:
      - "${RUST_PORT:-3000}:3000"
    volumes:
      - bambu_monitor_data:/data

  go2rtc:
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    ports:
      - "${GO2RTC_PORT:-1984}:1984"
      - "${GO2RTC_WEBRTC_PORT:-8555}:8555/tcp"
      - "${GO2RTC_WEBRTC_PORT:-8555}:8555/udp"
    volumes:
      - go2rtc_config:/config

volumes:
  bambu_monitor_data:
  go2rtc_config:
